name: Registry checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_test -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clinic_test:synthetic-ci-password@127.0.0.1:5432/clinic_test
      TEST_DATABASE_URL: postgresql://clinic_test:synthetic-ci-password@127.0.0.1:5432/clinic_test
      APP_ENV: development
      DEV_AUTH_TOKEN: synthetic-ci-development-key-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install -r services/api/requirements-dev.lock
      - run: python -m pip install -e services/api --no-deps
      - run: python scripts/check_structure.py
      - run: python -m ruff check --config services/api/pyproject.toml services/api scripts tests
      - run: python -m pytest
      - run: python scripts/migrate.py
      - run: npx playwright install --with-deps chromium
      - name: Start synthetic development servers
        run: |
          python -m uvicorn clinic_api.main:app --app-dir services/api/src --host 127.0.0.1 --port 8000 --no-access-log > /tmp/clinic-api.log 2>&1 &
          node node_modules/vite/bin/vite.js apps/web --host 127.0.0.1 --port 5174 --strictPort > /tmp/clinic-web.log 2>&1 &
          python scripts/wait-ready.py
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-registry-screenshots
          path: docs/screenshots/*.png
