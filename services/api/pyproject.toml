[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pediatric-clinic-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1", "pytest>=8,<10", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
